<svg viewBox="0 0 1080 880" width="1080" height="880" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<title>Flujo de integración WMS–Defontana y funciones a desarrollar para productos</title>
<desc>Pedidos e inventario usan APIs contratadas en tiempo real y ya están implementados. Productos se resuelve con un importador de Excel diario que requiere cinco componentes de desarrollo.</desc>

<defs>
<marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/></marker>
<marker id="aBr" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#2563EB"/></marker>
<marker id="aO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/></marker>
</defs>

<rect width="1080" height="880" fill="#FFFFFF"/>

<text x="30" y="36" font-size="18" font-weight="700" fill="#12151A">Integración WMS ↔ Defontana</text>
<text x="30" y="58" font-size="12.5" fill="#5C6370">Dos APIs contratadas ya operativas · el catálogo de productos se resuelve sin contratar Sale</text>

<text x="138" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#12151A">DEFONTANA ERP</text>
<text x="540" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#12151A">CANAL</text>
<text x="942" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#12151A">WMS</text>

<rect x="30" y="90" width="1020" height="120" rx="12" fill="#EFF4FF" stroke="#BFD3FB" stroke-width="1.5"/>
<text x="48" y="112" font-size="11" font-weight="700" fill="#1D4ED8" letter-spacing="0.6">CONTRATAR · API PEDIDOS</text>

<rect x="48" y="120" width="180" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="138" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Pedido de venta</text>
<text x="138" y="170" text-anchor="middle" font-size="11.5" fill="#5C6370">confirmado</text>

<line x1="236" y1="158" x2="384" y2="158" stroke="#2563EB" stroke-width="2.6" marker-start="url(#aBr)" marker-end="url(#aB)"/>
<text x="310" y="145" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">Order/List</text>
<text x="310" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">DispatchOrder</text>

<rect x="392" y="120" width="296" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="540" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Tiempo real · cola sync_jobs</text>
<text x="540" y="170" text-anchor="middle" font-size="11.5" fill="#3F8A3F">✓ Ya implementado — sin desarrollo</text>

<line x1="696" y1="158" x2="844" y2="158" stroke="#2563EB" stroke-width="2.6" marker-start="url(#aBr)" marker-end="url(#aB)"/>

<rect x="852" y="120" width="180" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="942" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Picking → Packing</text>
<text x="942" y="170" text-anchor="middle" font-size="11.5" fill="#5C6370">→ Despacho</text>

<rect x="30" y="222" width="1020" height="120" rx="12" fill="#EFF4FF" stroke="#BFD3FB" stroke-width="1.5"/>
<text x="48" y="244" font-size="11" font-weight="700" fill="#1D4ED8" letter-spacing="0.6">CONTRATAR · API INVENTARIO</text>

<rect x="48" y="252" width="180" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="138" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Documento de</text>
<text x="138" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">inventario</text>

<line x1="384" y1="290" x2="236" y2="290" stroke="#2563EB" stroke-width="2.6" marker-end="url(#aB)"/>
<text x="310" y="277" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">Inventory/Insert</text>
<text x="310" y="309" text-anchor="middle" font-size="11" fill="#5C6370">con idempotencia</text>

<rect x="392" y="252" width="296" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="540" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Tiempo real · cola sync_jobs</text>
<text x="540" y="302" text-anchor="middle" font-size="11.5" fill="#3F8A3F">✓ Ya implementado — sin desarrollo</text>

<line x1="844" y1="290" x2="696" y2="290" stroke="#2563EB" stroke-width="2.6" marker-end="url(#aB)"/>

<rect x="852" y="252" width="180" height="76" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="942" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Recepción · ajuste</text>
<text x="942" y="301" text-anchor="middle" font-size="11.5" fill="#5C6370">transferencia</text>

<rect x="30" y="354" width="1020" height="152" rx="12" fill="#FFF4EC" stroke="#FBCBA6" stroke-width="1.5"/>
<text x="48" y="376" font-size="11" font-weight="700" fill="#C2410C" letter-spacing="0.6">NO CONTRATAR SALE · EXCEL DIARIO</text>

<rect x="48" y="384" width="180" height="104" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="138" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Maestro de productos</text>
<text x="138" y="440" text-anchor="middle" font-size="11.5" fill="#5C6370">El alta de producto nuevo</text>
<text x="138" y="458" text-anchor="middle" font-size="11.5" fill="#5C6370">ocurre siempre aquí</text>

<line x1="236" y1="436" x2="384" y2="436" stroke="#C2410C" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#aO)"/>
<text x="310" y="423" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">exportar .xlsx</text>
<text x="310" y="455" text-anchor="middle" font-size="11" fill="#5C6370">1 vez al día</text>

<rect x="392" y="384" width="296" height="104" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="2"/>
<text x="540" y="412" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C2410C">Importador de Excel</text>
<text x="540" y="432" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C2410C">A DESARROLLAR — 5 piezas abajo</text>
<text x="540" y="456" text-anchor="middle" font-size="11" fill="#5C6370">Campo clave: <tspan font-weight="700" fill="#12151A">Code</tspan> de Defontana</text>
<text x="540" y="473" text-anchor="middle" font-size="11" fill="#5C6370">es lo que amarra con Inventory/Insert</text>

<line x1="696" y1="436" x2="844" y2="436" stroke="#C2410C" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#aO)"/>
<text x="770" y="423" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">upsert</text>

<rect x="852" y="384" width="180" height="104" rx="9" fill="#FFFFFF" stroke="#C9CFD9" stroke-width="1.3"/>
<text x="942" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#12151A">Catálogo local</text>
<text x="942" y="437" text-anchor="middle" font-size="11.5" fill="#5C6370">products + barcodes</text>
<text x="942" y="458" text-anchor="middle" font-size="11.5" fill="#5C6370">código de barras y bodega</text>
<text x="942" y="475" text-anchor="middle" font-size="11.5" fill="#5C6370">se gestionan aquí</text>

<rect x="30" y="528" width="1020" height="282" rx="12" fill="#F4F5F7" stroke="#D6DAE1" stroke-width="1.5"/>
<text x="48" y="556" font-size="14" font-weight="700" fill="#12151A">Qué hay que desarrollar para productos</text>
<text x="48" y="576" font-size="12" fill="#5C6370">Reemplaza a sync_products(), que hoy llama a Sale/GetSimpleProducts</text>

<rect x="48" y="592" width="187" height="112" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="1.6"/>
<circle cx="70" cy="617" r="12" fill="#C2410C"/><text x="70" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<text x="90" y="622" font-size="12.5" font-weight="700" fill="#12151A">Endpoint carga</text>
<text x="64" y="648" font-size="11" fill="#3D434D">POST /products/import</text>
<text x="64" y="666" font-size="11" fill="#3D434D">recibe el archivo .xlsx</text>
<text x="64" y="684" font-size="11" fill="#5C6370">reusa auth por rol</text>

<rect x="247" y="592" width="187" height="112" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="1.6"/>
<circle cx="269" cy="617" r="12" fill="#C2410C"/><text x="269" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<text x="289" y="622" font-size="12.5" font-weight="700" fill="#12151A">Parser</text>
<text x="263" y="648" font-size="11" fill="#3D434D">lee columnas del Excel</text>
<text x="263" y="666" font-size="11" fill="#3D434D">valida Code obligatorio</text>
<text x="263" y="684" font-size="11" fill="#5C6370">todo o nada si falla</text>

<rect x="446" y="592" width="187" height="112" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="1.6"/>
<circle cx="468" cy="617" r="12" fill="#C2410C"/><text x="468" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<text x="488" y="622" font-size="12.5" font-weight="700" fill="#12151A">Mapper</text>
<text x="462" y="648" font-size="11" fill="#3D434D">fila → documento WMS</text>
<text x="462" y="666" font-size="11" fill="#5C6370">adapta el existente</text>
<text x="462" y="684" font-size="11" fill="#5C6370">map_product()</text>

<rect x="645" y="592" width="187" height="112" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="1.6"/>
<circle cx="667" cy="617" r="12" fill="#C2410C"/><text x="667" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
<text x="687" y="622" font-size="12.5" font-weight="700" fill="#12151A">Upsert</text>
<text x="661" y="648" font-size="11" fill="#3D434D">crea o actualiza por SKU</text>
<text x="661" y="666" font-size="11" fill="#3D434D">agrega barcodes nuevos</text>
<text x="661" y="684" font-size="11" fill="#5C6370">ya existe, se reutiliza</text>

<rect x="844" y="592" width="188" height="112" rx="9" fill="#FFFFFF" stroke="#E8873F" stroke-width="1.6"/>
<circle cx="866" cy="617" r="12" fill="#C2410C"/><text x="866" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
<text x="886" y="622" font-size="12.5" font-weight="700" fill="#12151A">Reporte y alerta</text>
<text x="860" y="648" font-size="11" fill="#3D434D">creados / actualizados</text>
<text x="860" y="666" font-size="11" fill="#3D434D">filas rechazadas</text>
<text x="860" y="684" font-size="11" fill="#5C6370">avisa si no hubo carga</text>

<rect x="48" y="718" width="984" height="72" rx="9" fill="#FFFFFF" stroke="#D6DAE1" stroke-width="1.3"/>
<text x="66" y="742" font-size="12.5" font-weight="700" fill="#12151A">Ya existe y se reutiliza</text>
<text x="66" y="762" font-size="11.5" fill="#3D434D">Colecciones products y barcodes · lógica de upsert de sync_products() · DefontanaMapper.map_product() · autenticación por rol · pantalla de catálogo</text>
<text x="66" y="780" font-size="11.5" fill="#3D434D">Bodegas: mantenedor manual, carga única al dar de alta una bodega — no requiere Excel ni API</text>

<line x1="290" y1="842" x2="326" y2="842" stroke="#2563EB" stroke-width="2.6"/>
<text x="336" y="847" font-size="12" fill="#3D434D">API contratada · tiempo real · ya construida</text>
<line x1="640" y1="842" x2="676" y2="842" stroke="#C2410C" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="686" y="847" font-size="12" fill="#3D434D">Proceso batch · a desarrollar</text>
</svg>
